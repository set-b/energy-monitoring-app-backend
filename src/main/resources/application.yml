spring:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:                                              # lowercase, one word
    url: jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  mvc:
    pathMatch:
      matching-strategy: ant-path-matcher